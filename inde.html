document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

'woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody { margin:0; background:#08111f; }\na { color:#d94f2b; text-decoration:none; }\na:hover { color:#f07a56; }\n@keyframes riseUp { from { opacity:0; transform:translateY(22px); } }\n@keyframes riseSoft { from { opacity:0; transform:translateY(12px); } }\n@keyframes fadeIn { from { opacity:0; } }\n@keyframes gridDrift { to { transform:translate3d(72px,72px,0); } }\n@keyframes glowPulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.06); } }\n@keyframes barGrow { from { transform:scaleX(0); } }\nsection[data-deck-active] [data-anim=\"up\"] { animation:riseUp .7s cubic-bezier(.2,.85,.2,1) both; }\nsection[data-deck-active] [data-anim=\"up2\"] { animation:riseUp .8s cubic-bezier(.2,.85,.2,1) .1s both; }\nsection[data-deck-active] [data-anim=\"up3\"] { animation:riseSoft .8s cubic-bezier(.2,.85,.2,1) .22s both; }\nsection[data-deck-active] [data-anim=\"fade\"] { animation:fadeIn 1.1s ease .3s both; }\n[data-bg-grid] { animation:gridDrift 26s linear infinite; }\n[data-bg-glow] { animation:glowPulse 16s ease-in-out infinite; }\n@media print { [data-anim],[data-bg-grid],[data-bg-glow] { animation:none !important; } }\n@media (prefers-reduced-motion: reduce) { [data-anim],[data-bg-grid],[data-bg-glow] { animation:none !important; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<x-import component-from-global-scope=\"deck-stage\" from=\"ecec07c7-d300-488e-81f0-1b78245f09a4#/deck-stage.js\" width=\"1920\" height=\"1080\" hint-size=\"100%,100%\" data-uneditable=\"\">\n\n<section data-label=\"Title\" data-screen-label=\"01\" data-speaker-notes=\"One statistical habit, two centuries of consequences.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n    <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">A presentation on risk in AI development<\u002Fdiv>\n    <div style=\"font-size:24px;letter-spacing:0.2em;color:#6b8299\">2026<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:34px;max-width:1500px\">\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:158px;font-weight:500;line-height:0.92;letter-spacing:-0.045em;margin:0\">The Correlation Trap<\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:26px\">\n      <div style=\"width:120px;height:3px;background:#d94f2b\"><\u002Fdiv>\n      <div style=\"font-size:36px;letter-spacing:0.02em;color:#e9e6df\">From Racial Hygiene to Algorithmic Bias<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:29px;line-height:1.55;color:#98a2ac;max-width:1180px;text-wrap:pretty\">How the misuse of statistical correlation gave eugenics and Nazi racial science the appearance of objective fact — and why the same mechanism is quietly resurfacing in machine learning.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:80px;border-top:1px solid #1d2f47;padding-top:28px\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;max-width:1040px\">\n      <div style=\"font-size:28px;color:#e9e6df\">Carmel Nadav<\u002Fdiv>\n      <div style=\"font-size:24px;color:#6b8299\">Extending “Correlation: A Biography of Dangerous Ideas” — FARCON, Carlson School of Management, 2016<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:24px;color:#4a6076\">© 2026 Carmel Nadav · All Rights Reserved<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Central question\" data-screen-label=\"02\" data-speaker-notes=\"Correlation is not causation, but it looks like it — and that resemblance has always been exploitable.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Framing<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:72px;font-weight:500;line-height:1.04;letter-spacing:-0.03em;margin:26px 0 0;max-width:1400px\">One statistical habit, two centuries of consequences<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:56px;flex:1\">\n    <div style=\"display:flex;flex-direction:column;gap:34px;font-size:28px;line-height:1.55;color:#b6c4d3\">\n      <div style=\"text-wrap:pretty\">Correlation is not causation — but it looks like causation, and that resemblance has always been exploitable.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">In the late 1800s, the newly invented tools of correlation and statistical significance were used to dress up racial prejudice as science: first as eugenics, then as Nazi racial hygiene.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">Today, machine learning is at its core a correlation-finding engine, operating at a scale Galton and Pearson could never have imagined.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:3px solid #d94f2b;padding:6px 0 6px 44px;display:flex;flex-direction:column;justify-content:center;gap:26px\">\n      <div style=\"font-size:24px;letter-spacing:0.28em;text-transform:uppercase;color:#d94f2b\">The central question<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:46px;line-height:1.22;letter-spacing:-0.015em;color:#e9e6df;text-wrap:pretty\">Is correlation, once again, quietly doing the ideological work inside our models that it once did inside eugenic “science”?<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Four acts\" data-screen-label=\"03\" data-speaker-notes=\"Roadmap.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Roadmap<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:72px;font-weight:500;letter-spacing:-0.03em;margin:26px 0 0\">Four acts<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:64px;flex:1;background:#1d2f47\">\n    <div style=\"background:#08111f;padding:36px 30px 30px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:88px;line-height:1;color:#d94f2b\">I<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.25;color:#e9e6df\">The Birth of “Scientific” Racism<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">How correlation and significance testing were invented inside the eugenics movement.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#08111f;padding:36px 30px 30px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:88px;line-height:1;color:#d94f2b\">II<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.25;color:#e9e6df\">Racial Hygiene as State Policy<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">How Nazi Germany turned statistical “science” into law, sterilization, and genocide.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#08111f;padding:36px 30px 30px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:88px;line-height:1;color:#d94f2b\">III<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.25;color:#e9e6df\">Correlation at Scale: AI Today<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">How modern machine learning reproduces the same proxy logic — faster, bigger, quieter.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#08111f;padding:36px 30px 30px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:88px;line-height:1;color:#d94f2b\">IV<\u002Fdiv>\n      <div style=\"font-size:33px;line-height:1.25;color:#e9e6df\">The Pattern &amp; the Path Forward<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">What history warns us to watch for, and what responsible AI requires.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Act I\" data-screen-label=\"04\" data-speaker-notes=\"Act I divider.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:340px;line-height:0.8;letter-spacing:-0.04em;color:#c9c4b8\">I<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:500;line-height:1.02;letter-spacing:-0.035em;margin-top:40px;max-width:1450px\">The Birth of “Scientific” Racism<\u002Fdiv>\n  <div style=\"font-size:30px;line-height:1.5;color:#4a5460;margin-top:32px;max-width:1150px;text-wrap:pretty\">Correlation and significance testing were not neutral inventions. They were built to prove racial hierarchy.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Primer (interactive)\" data-screen-label=\"05\" data-speaker-notes=\"Click the button: the same scatter, once you can see the hidden third factor.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">A quick primer<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Correlation measures pattern, not cause<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1.05fr;gap:72px;margin-top:44px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:26px;font-size:27px;line-height:1.5;color:#b6c4d3\">\n      <div style=\"display:flex;gap:20px\"><div style=\"color:#d94f2b;flex:none\">01<\u002Fdiv><div style=\"text-wrap:pretty\">Correlation tells you two things move together — nothing about why.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:20px\"><div style=\"color:#d94f2b;flex:none\">02<\u002Fdiv><div style=\"text-wrap:pretty\">A correlation can be real, strong and reproducible, and still be driven entirely by a hidden third factor.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:20px\"><div style=\"color:#d94f2b;flex:none\">03<\u002Fdiv><div style=\"text-wrap:pretty\">The danger is not the math. It is treating a correlation as a discovered truth about who people are.<\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;gap:20px\"><div style=\"color:#d94f2b;flex:none\">04<\u002Fdiv><div style=\"text-wrap:pretty\">That single slippage — correlation dressed up as essential truth — is the thread running through this deck.<\u002Fdiv><\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleConfound }}\" style=\"margin-top:auto;align-self:flex-start;background:#122238;border:1px solid #d94f2b;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.1em;text-transform:uppercase;padding:20px 30px;cursor:pointer;min-height:48px;white-space:nowrap\" style-hover=\"background:#d94f2b\">{{ confoundLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:34px;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#6b8299\">\n        <div>fig. 1 · observed association<\u002Fdiv>\n        <div>r = 0.81<\u002Fdiv>\n      <\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 560 380\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;flex:1;margin-top:18px;min-height:0\">\n        <g stroke=\"#1d2f47\" stroke-width=\"1\">\n          <line x1=\"60\" y1=\"40\" x2=\"60\" y2=\"330\"><\u002Fline>\n          <line x1=\"60\" y1=\"330\" x2=\"540\" y2=\"330\"><\u002Fline>\n          <line x1=\"60\" y1=\"112\" x2=\"540\" y2=\"112\" stroke-dasharray=\"3 6\"><\u002Fline>\n          <line x1=\"60\" y1=\"185\" x2=\"540\" y2=\"185\" stroke-dasharray=\"3 6\"><\u002Fline>\n          <line x1=\"60\" y1=\"257\" x2=\"540\" y2=\"257\" stroke-dasharray=\"3 6\"><\u002Fline>\n        <\u002Fg>\n        <sc-for list=\"{{ points }}\" as=\"p\" hint-placeholder-count=\"0\">\n          <circle cx=\"{{ p.x }}\" cy=\"{{ p.y }}\" r=\"5.5\" fill=\"{{ p.fill }}\" opacity=\"0.9\"><\u002Fcircle>\n        <\u002Fsc-for>\n        <line x1=\"72\" y1=\"300\" x2=\"528\" y2=\"70\" stroke=\"#e9e6df\" stroke-width=\"2\" stroke-dasharray=\"8 6\"><\u002Fline>\n        <text x=\"60\" y=\"358\" fill=\"#6b8299\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">measured trait<\u002Ftext>\n        <text x=\"24\" y=\"34\" fill=\"#6b8299\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">outcome<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"border-top:1px solid #1d2f47;margin-top:14px;padding-top:16px;font-size:24px;line-height:1.45;color:#93a5b8;min-height:96px;text-wrap:pretty\">{{ confoundNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Galton\" data-screen-label=\"06\" data-speaker-notes=\"The movement and the mathematics were born together.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act I · 1869–1911<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Francis Galton: inventing the tools, ranking the races<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:72px;margin-top:48px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:28px;font-size:27px;line-height:1.5;color:#b6c4d3\">\n      <div style=\"text-wrap:pretty\">Galton pioneered regression and correlation as statistical methods — tools still used across all of science and AI today.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">In <em style=\"color:#e9e6df;font-style:normal\">Hereditary Genius<\u002Fem> (1869) he studied families of “eminent” men to argue that talent was inherited, not earned.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">He extended the same method to rank entire racial groups on a bell curve.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">He coined the term <em style=\"color:#e9e6df;font-style:normal\">eugenics<\u002Fem> in 1883. The movement and the mathematics were born together.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:30px;min-height:0\">\n      <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:26px 30px;display:flex;flex-direction:column;flex:1;min-height:0\">\n        <div style=\"font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#6b8299\">fig. 2 · ranking by curve<\u002Fdiv>\n        <svg sc-camel-view-box=\"0 0 520 210\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;flex:1;margin-top:12px;min-height:0\">\n          <path d=\"M20 180 C 120 180 130 40 210 40 C 290 40 300 180 400 180\" fill=\"none\" stroke=\"#e9e6df\" stroke-width=\"2\"><\u002Fpath>\n          <path d=\"M120 180 C 220 180 230 76 310 76 C 390 76 400 180 500 180\" fill=\"none\" stroke=\"#d94f2b\" stroke-width=\"2\" stroke-dasharray=\"7 5\"><\u002Fpath>\n          <line x1=\"20\" y1=\"180\" x2=\"500\" y2=\"180\" stroke=\"#1d2f47\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"210\" y1=\"180\" x2=\"210\" y2=\"40\" stroke=\"#2c4460\" stroke-width=\"1\" stroke-dasharray=\"3 5\"><\u002Fline>\n          <line x1=\"310\" y1=\"180\" x2=\"310\" y2=\"76\" stroke=\"#2c4460\" stroke-width=\"1\" stroke-dasharray=\"3 5\"><\u002Fline>\n          <text x=\"150\" y=\"205\" fill=\"#93a5b8\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">“two grades”<\u002Ftext>\n          <path d=\"M262 196 L 302 196\" stroke=\"#d94f2b\" stroke-width=\"1.5\"><\u002Fpath>\n        <\u002Fsvg>\n        <div style=\"font-size:24px;color:#6b8299;margin-top:6px\">A shifted mean, presented as a fact of nature.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-left:3px solid #d94f2b;padding-left:32px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.25;color:#e9e6df;text-wrap:pretty\">“The average intellectual standard of the Negro race is some two grades below our own.”<\u002Fdiv>\n        <div style=\"font-size:24px;color:#93a5b8;margin-top:16px\">— Francis Galton, <em style=\"font-style:normal\">Hereditary Genius<\u002Fem> (1869)<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Pearson\" data-screen-label=\"07\" data-speaker-notes=\"The template still used to judge whether a result is statistically real.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act I · 1890s–1930s<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Karl Pearson: giving racial hierarchy a p-value<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:72px;margin-top:48px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:28px;font-size:27px;line-height:1.5;color:#b6c4d3\">\n      <div style=\"text-wrap:pretty\">Pearson, Galton’s protégé, formalized the correlation coefficient and invented the chi-squared significance test — the template still used to judge whether a result is “statistically real.”<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">He was explicit that the method served a racial and national purpose: <span style=\"color:#e9e6df\">“the nation organized for the struggle must be a homogeneous whole, not a mixture of superior and inferior races.”<\u002Fspan><\u002Fdiv>\n      <div style=\"text-wrap:pretty\">As editor of <em style=\"color:#e9e6df;font-style:normal\">Biometrika<\u002Fem> and founder of UCL’s eugenics laboratory, he trained a generation to treat racial ranking as a peer-reviewed finding.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:36px 38px;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#d94f2b\">The template he built<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;background:#1d2f47;border:1px solid #1d2f47\">\n        <div style=\"background:#0c1a2c;padding:18px 22px;display:flex;gap:20px;align-items:baseline\"><span style=\"color:#6b8299;font-size:24px\">01<\u002Fspan><span style=\"font-size:29px\">Hypothesize a distribution<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#0c1a2c;padding:18px 22px;display:flex;gap:20px;align-items:baseline\"><span style=\"color:#6b8299;font-size:24px\">02<\u002Fspan><span style=\"font-size:29px\">Measure deviation from it<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#0c1a2c;padding:18px 22px;display:flex;gap:20px;align-items:baseline\"><span style=\"color:#6b8299;font-size:24px\">03<\u002Fspan><span style=\"font-size:29px\">Calculate a probability value<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#0c1a2c;padding:18px 22px;display:flex;gap:20px;align-items:baseline\"><span style=\"color:#d94f2b;font-size:24px\">04<\u002Fspan><span style=\"font-size:29px;color:#d94f2b\">Declare the result “significant”<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Still the basic logic of hypothesis testing today — built, in part, to argue for racial homogeneity.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Into policy\" data-screen-label=\"08\" data-speaker-notes=\"Sterilization, immigration restriction, and academic legitimacy.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act I · 1900s–1940s<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">“Scientific” racism becomes public policy<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:60px;flex:1;background:#1d2f47\">\n    <div style=\"background:#0c1a2c;padding:36px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:74px;line-height:1;color:#d94f2b\">60,000<\u002Fdiv>\n      <div style=\"font-size:32px;color:#e9e6df\">Forced sterilization<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Americans sterilized under state eugenics laws. <em style=\"font-style:normal;color:#b6c4d3\">Buck v. Bell<\u002Fem> (1927) upheld compulsory sterilization.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:36px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:74px;line-height:1;color:#d94f2b\">1924<\u002Fdiv>\n      <div style=\"font-size:32px;color:#e9e6df\">Immigration restriction<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">IQ testing and eugenic “science” were cited to justify the Immigration Act, which capped entry by national origin.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:36px 32px;display:flex;flex-direction:column;gap:20px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:74px;line-height:1;color:#d94f2b\">Both<\u002Fdiv>\n      <div style=\"font-size:32px;color:#e9e6df\">Academic legitimacy<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Elite universities on both sides of the Atlantic funded eugenics laboratories, journals and professorships — the imprimatur of “real science.”<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Act II\" data-screen-label=\"09\" data-speaker-notes=\"Act II divider.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:340px;line-height:0.8;letter-spacing:-0.04em;color:#c9c4b8\">II<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:500;line-height:1.02;letter-spacing:-0.035em;margin-top:40px;max-width:1450px\">Racial Hygiene as State Policy<\u002Fdiv>\n  <div style=\"font-size:30px;line-height:1.5;color:#4a5460;margin-top:32px;max-width:1150px;text-wrap:pretty\">Nazi Germany took eugenic “science” out of the journal and wrote it directly into law.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Statute to genocide\" data-screen-label=\"10\" data-speaker-notes=\"Six years from the first sterilization statute to mass murder.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-start\">\n    <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act II · Timeline<\u002Fdiv>\n    <div style=\"font-size:24px;color:#93a5b8;max-width:640px;text-align:right;line-height:1.4;text-wrap:pretty\">“Nazism is nothing but applied biology.” <span style=\"color:#6b8299\">— Rudolf Hess<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">From statute to genocide in six years<\u002Fdiv>\n  <div style=\"font-size:26px;line-height:1.5;color:#93a5b8;margin-top:22px;max-width:1500px;text-wrap:pretty\">Geneticists, psychiatrists and anthropologists sat on “hereditary health courts,” giving sterilization orders the appearance of clinical due process. Key architects — Arthur Gütt, Falk Ruttke, Ernst Rüdin — had built their careers inside the same research tradition as Galton and Pearson.<\u002Fdiv>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;margin-top:20px\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:36px\">\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;color:#e9e6df;line-height:1\">1933<\u002Fdiv>\n        <div style=\"height:2px;background:#d94f2b\"><\u002Fdiv>\n        <div style=\"font-size:27px;line-height:1.3;color:#e9e6df;text-wrap:pretty\">Law for the Prevention of Offspring with Hereditary Diseases<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Mandated forced sterilization for conditions the state deemed hereditary, decided by “hereditary health courts.”<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;color:#e9e6df;line-height:1\">1935<\u002Fdiv>\n        <div style=\"height:2px;background:#a8412a\"><\u002Fdiv>\n        <div style=\"font-size:27px;line-height:1.3;color:#e9e6df;text-wrap:pretty\">Blood Protection Law (Nuremberg Laws)<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Criminalized marriage and sexual relations between Jews and non-Jewish Germans using pseudo-scientific racial classification.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;color:#e9e6df;line-height:1\">1936<\u002Fdiv>\n        <div style=\"height:2px;background:#77321f\"><\u002Fdiv>\n        <div style=\"font-size:27px;line-height:1.3;color:#e9e6df;text-wrap:pretty\">Reich Central Office for Combating Homosexuality and Abortion<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Extended reproductive and biological policing across further population groups.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:18px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;color:#e9e6df;line-height:1\">1939–45<\u002Fdiv>\n        <div style=\"height:2px;background:#48200f\"><\u002Fdiv>\n        <div style=\"font-size:27px;line-height:1.3;color:#e9e6df;text-wrap:pretty\">“Final Solutions”<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Racial hygiene escalated from sterilization and segregation into the T4 euthanasia program and the Holocaust.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Scale\" data-screen-label=\"11\" data-speaker-notes=\"The pipeline was continuous, and at every step pointed to scientific authority.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act II · Scale<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Statistics with a body count<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:52px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:44px\">\n      <div>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:132px;line-height:0.95;color:#d94f2b;letter-spacing:-0.03em\">~400,000<\u002Fdiv>\n        <div style=\"font-size:29px;line-height:1.45;color:#b6c4d3;margin-top:14px;text-wrap:pretty\">Germans forcibly sterilized under the 1933 hereditary health law<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:40px;border-top:1px solid #1d2f47;padding-top:36px\">\n        <div>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;color:#e9e6df;line-height:1\">“Routine”<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;margin-top:12px;text-wrap:pretty\">Hereditary health court decisions — due process in appearance only<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;color:#e9e6df;line-height:1\">6 years<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;margin-top:12px;text-wrap:pretty\">From the first sterilization statute to mass genocide<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:38px;display:flex;flex-direction:column;justify-content:center;gap:0\">\n      <div style=\"font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#6b8299\">fig. 3 · the pipeline<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;margin-top:28px\">\n        <div style=\"display:flex;align-items:center;gap:24px;padding:20px 0\"><div style=\"width:14px;height:14px;background:#e9e6df;flex:none\"><\u002Fdiv><div style=\"font-size:30px\">Statistical classification<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-left:6px;width:2px;height:26px;background:#2c4460\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:24px;padding:20px 0\"><div style=\"width:14px;height:14px;background:#c7b9a8;flex:none\"><\u002Fdiv><div style=\"font-size:30px\">Legal category<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-left:6px;width:2px;height:26px;background:#2c4460\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:24px;padding:20px 0\"><div style=\"width:14px;height:14px;background:#d94f2b;flex:none\"><\u002Fdiv><div style=\"font-size:30px\">Medicalized coercion<\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-left:6px;width:2px;height:26px;background:#2c4460\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:24px;padding:20px 0\"><div style=\"width:14px;height:14px;background:#8a2d16;flex:none\"><\u002Fdiv><div style=\"font-size:30px\">Mass murder<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1d2f47;margin-top:24px;padding-top:20px;font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">At every step the system pointed to scientific authority as its justification.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"The mechanism\" data-screen-label=\"12\" data-speaker-notes=\"Find, launder, institutionalize. Remember these three.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#a8412a\">The mechanism<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">How correlation “helped” — the three-step pattern<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:44px;margin-top:64px;flex:1\">\n    <div style=\"border-top:3px solid #0b0d10;padding-top:32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;line-height:0.9;color:#a8412a\">1<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:1.15;letter-spacing:-0.02em\">Find a correlation<\u002Fdiv>\n      <div style=\"font-size:27px;line-height:1.5;color:#4a5460;text-wrap:pretty\">A statistical association appears between a trait — skull shape, IQ score, “blood” — and an outcome: crime, poverty, intellect.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:3px solid #0b0d10;padding-top:32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;line-height:0.9;color:#a8412a\">2<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:1.15;letter-spacing:-0.02em\">Launder it as cause<\u002Fdiv>\n      <div style=\"font-size:27px;line-height:1.5;color:#4a5460;text-wrap:pretty\">The correlation is presented as proof of an inherent, hereditary difference between groups, stripped of the social history that produced it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:3px solid #0b0d10;padding-top:32px;display:flex;flex-direction:column;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;line-height:0.9;color:#a8412a\">3<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;line-height:1.15;letter-spacing:-0.02em\">Institutionalize the loop<\u002Fdiv>\n      <div style=\"font-size:27px;line-height:1.5;color:#4a5460;text-wrap:pretty\">Policy is built on the finding, which shapes who is tested, counted or surveilled next — manufacturing more data that appears to confirm it.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #c9c4b8;padding-top:26px;font-size:26px;color:#4a5460\">Hold on to these three. Act III is the same loop, in code.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Act III\" data-screen-label=\"13\" data-speaker-notes=\"Act III divider.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:340px;line-height:0.8;letter-spacing:-0.04em;color:#c9c4b8\">III<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:500;line-height:1.02;letter-spacing:-0.035em;margin-top:40px;max-width:1450px\">Correlation at Scale: AI Today<\u002Fdiv>\n  <div style=\"font-size:30px;line-height:1.5;color:#4a5460;margin-top:32px;max-width:1150px;text-wrap:pretty\">The same three-step pattern — find, launder, institutionalize — now runs inside machine learning pipelines.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Proxy demo (interactive)\" data-screen-label=\"14\" data-speaker-notes=\"Drop the race column and watch the proxies pick the signal back up.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act III · The mechanism, updated<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Proxies: how protected traits sneak back in<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:0.85fr 1.15fr;gap:72px;margin-top:44px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:26px;font-size:27px;line-height:1.5;color:#b6c4d3\">\n      <div style=\"text-wrap:pretty\">Most predictive models — credit scoring, hiring, recidivism risk — find statistical correlations between input features and an outcome label. They are not asked whether those correlations are causal, fair, or historically contaminated.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">Trained on historical data, a model learns historical discrimination as a neutral statistical fact. The difference is scale: Pearson analyzed hundreds of cases by hand; a model scores millions of people a day.<\u002Fdiv>\n      <div style=\"border-left:3px solid #d94f2b;padding-left:28px;font-family:'Space Grotesk',sans-serif;font-size:36px;line-height:1.25;color:#e9e6df;text-wrap:pretty\">A model doesn’t see race. It sees a scatterplot — and a proxy that fits it just as well.<\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{ toggleProxy }}\" style=\"margin-top:auto;align-self:flex-start;background:#122238;border:1px solid #d94f2b;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.1em;text-transform:uppercase;padding:20px 30px;cursor:pointer;min-height:48px;white-space:nowrap\" style-hover=\"background:#d94f2b\">{{ proxyLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:20px 26px;display:flex;flex-direction:column;min-height:0;overflow:hidden\">\n      <div style=\"display:flex;justify-content:space-between;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#6b8299\">\n        <div>fig. 4 · feature set<\u002Fdiv>\n        <div>{{ proxyStatus }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px;margin-top:18px;flex:1;justify-content:center\">\n        <div style=\"display:flex;align-items:center;gap:20px;padding:8px 0;border-bottom:1px solid #1d2f47\">\n          <div style=\"width:380px;flex:none;font-size:26px;color:#e9e6df;text-decoration:{{ raceDecoration }}\">race (explicit)<\u002Fdiv>\n          <div style=\"flex:1;height:18px;background:#122238\"><div style=\"height:100%;background:#6b8299;width:{{ raceWidth }}\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:118px;flex:none;text-align:right;font-size:24px;color:#93a5b8\">{{ raceValue }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ proxies }}\" as=\"p\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex;align-items:center;gap:20px;padding:8px 0;border-bottom:1px solid #1d2f47\">\n            <div style=\"width:380px;flex:none;display:flex;flex-direction:column;gap:5px\">\n              <div style=\"font-size:26px;color:#e9e6df\">{{ p.name }}<\u002Fdiv>\n              <div style=\"font-size:24px;line-height:1.3;color:#6b8299\">{{ p.stands }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;height:18px;background:#122238\"><div style=\"height:100%;background:{{ p.color }};width:{{ p.w }};transition:width 700ms cubic-bezier(.2,.7,.2,1)\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"width:118px;flex:none;text-align:right;font-size:24px;color:#b6c4d3\">{{ p.v }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1d2f47;margin-top:10px;padding-top:14px;font-size:24px;line-height:1.4;color:#93a5b8;text-wrap:pretty\">{{ proxyNote }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Case studies (interactive)\" data-screen-label=\"15\" data-speaker-notes=\"Click through the six cases. Same loop each time.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act III · Case studies<\u002Fdiv>\n    <div style=\"font-size:24px;letter-spacing:0.2em;color:#6b8299\">{{ caseCounter }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:400px 1fr;gap:64px;margin-top:34px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:2px;border-top:1px solid #1d2f47\">\n      <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <div sc-camel-on-click=\"{{ c.select }}\" style=\"cursor:pointer;border-bottom:1px solid #1d2f47;padding:15px 14px;display:flex;gap:14px;align-items:flex-start;background:{{ c.bg }};min-height:48px\" style-hover=\"background:#122238\">\n          <div style=\"font-size:24px;color:{{ c.numColor }};flex:none\">{{ c.num }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:26px;line-height:1.25;color:{{ c.titleColor }}\">{{ c.tab }}<\u002Fdiv>\n            <div style=\"font-size:24px;letter-spacing:0.14em;text-transform:uppercase;color:#6b8299\">{{ c.domain }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:500;line-height:1.06;letter-spacing:-0.03em\">{{ activeCase.title }}<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.5;color:#93a5b8;margin-top:20px;max-width:1180px;text-wrap:pretty\">{{ activeCase.desc }}<\u002Fdiv>\n      <div style=\"display:flex;gap:56px;margin-top:34px;flex:1;min-height:0\">\n        <div style=\"width:340px;flex:none;border-left:3px solid #d94f2b;padding-left:30px\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:{{ activeCase.heroSize }};line-height:0.98;color:#d94f2b;letter-spacing:-0.03em;overflow-wrap:break-word\">{{ activeCase.heroN }}<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.45;color:#b6c4d3;margin-top:16px;text-wrap:pretty\">{{ activeCase.heroL }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:26px;min-height:0\">\n          <sc-for list=\"{{ activeCase.bars }}\" as=\"b\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n                <div style=\"font-size:24px;color:#b6c4d3\">{{ b.label }}<\u002Fdiv>\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;color:{{ b.color }}\">{{ b.val }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:18px;background:#122238\"><div style=\"height:100%;background:{{ b.color }};width:{{ b.w }};transition:width 600ms ease-out\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-for list=\"{{ activeCase.notes }}\" as=\"n\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;gap:24px;align-items:baseline;border-top:1px solid #1d2f47;padding-top:20px\">\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-size:36px;color:#e9e6df;flex:none;min-width:210px\">{{ n.n }}<\u002Fdiv>\n              <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">{{ n.l }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-top:1px solid #1d2f47;padding-top:18px;margin-top:12px;font-size:24px;line-height:1.4;color:#6b8299\">{{ activeCase.source }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"TESCREAL\" data-screen-label=\"16\" data-speaker-notes=\"The claim is not that AI researchers are reviving Nazism. It is that the pattern recurs.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act III · AI research culture<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">When the pattern echoes inside AI research itself<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:44px;background:#1d2f47;border:1px solid #1d2f47\">\n    <div style=\"background:#0c1a2c;padding:18px 24px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:46px;color:#d94f2b;line-height:1\">1996<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.45;color:#b6c4d3;text-wrap:pretty\">Nick Bostrom claims on an internet mailing list that Black people are “more stupid than whites,” citing a supposed IQ gap.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:18px 24px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:46px;color:#d94f2b;line-height:1\">2002<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.45;color:#b6c4d3;text-wrap:pretty\">His foundational existential-risk paper warns of “dysgenic pressures” — a “negative correlation between intellectual achievement and fertility.”<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:18px 24px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:46px;color:#d94f2b;line-height:1\">Apr. 2024<\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.45;color:#b6c4d3;text-wrap:pretty\">Oxford shuts the Future of Humanity Institute down without public explanation, days after the 1996 post resurfaces. Bostrom calls it “death by bureaucracy.”<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:72px;margin-top:34px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div style=\"font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#d94f2b\">A name for the pattern<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px\">\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">T<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Transhumanism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">E<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Extropianism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">S<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Singularitarianism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">C<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Cosmism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">R<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Rationalism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">EA<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Effective Altruism<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#122238;padding:12px 16px;display:flex;align-items:baseline;gap:14px\"><div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;width:44px;flex:none\">L<\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Longtermism<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Timnit Gebru and Émile Torres coined the term for a cluster of ideologies influential in AI-safety circles that they argue repackages eugenic reasoning about “improving” humanity’s genetic stock as concern for the far future. Gebru has called longtermism “eugenics under a different name.”<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:3px solid #d94f2b;padding-left:40px;display:flex;flex-direction:column;justify-content:center;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:40px;line-height:1.24;color:#e9e6df;text-wrap:pretty\">The claim is not that today’s AI researchers are reviving Nazism. It is that the same three-step pattern — find a correlation, launder it as essential truth, institutionalize the belief — has resurfaced inside institutions now shaping AI-safety priorities and funding.<\u002Fdiv>\n      <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-size:24px;line-height:1.4;color:#6b8299\">The Guardian / Center for Genetics and Society, “‘Eugenics on Steroids’” (2024); Torres, É., Truthdig.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Act IV\" data-screen-label=\"17\" data-speaker-notes=\"Act IV di
