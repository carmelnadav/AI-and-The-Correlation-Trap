vider.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:340px;line-height:0.8;letter-spacing:-0.04em;color:#c9c4b8\">IV<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:96px;font-weight:500;line-height:1.02;letter-spacing:-0.035em;margin-top:40px;max-width:1450px\">The Pattern &amp; The Path Forward<\u002Fdiv>\n  <div style=\"font-size:30px;line-height:1.5;color:#4a5460;margin-top:32px;max-width:1150px;text-wrap:pretty\">History does not repeat exactly — but the underlying statistical habit is disturbingly familiar.<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Same mechanism\" data-screen-label=\"18\" data-speaker-notes=\"Read this table row by row. Left column then right.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · The pattern<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:66px;font-weight:500;letter-spacing:-0.03em;margin:20px 0 0\">Same mechanism, new machinery<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:280px 1fr 1fr;margin-top:40px;flex:1;min-height:0;border-top:1px solid #1d2f47\">\n    <div style=\"padding:16px 22px 16px 0;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#6b8299;border-bottom:1px solid #1d2f47\">Mechanism<\u002Fdiv>\n    <div style=\"padding:16px 26px;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#93a5b8;border-bottom:1px solid #1d2f47;background:#0c1a2c\">Eugenics / racial hygiene · 1870s–1940s<\u002Fdiv>\n    <div style=\"padding:16px 26px;font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#d94f2b;border-bottom:1px solid #1d2f47;background:#151a2c\">AI / machine learning · 2010s–today<\u002Fdiv>\n\n    <div style=\"padding:19px 22px 19px 0;font-size:26px;color:#e9e6df;border-bottom:1px solid #1d2f47\">Statistical tool<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#0c1a2c;text-wrap:pretty\">Correlation, regression, significance testing (Galton, Pearson)<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#151a2c;text-wrap:pretty\">Correlation-based pattern learning at massive scale<\u002Fdiv>\n\n    <div style=\"padding:19px 22px 19px 0;font-size:26px;color:#e9e6df;border-bottom:1px solid #1d2f47\">Claim of objectivity<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#0c1a2c;text-wrap:pretty\">“Scientific” journals, professorships, biometric laboratories<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#151a2c;text-wrap:pretty\">“The algorithm decided” — automation framed as neutral<\u002Fdiv>\n\n    <div style=\"padding:19px 22px 19px 0;font-size:26px;color:#e9e6df;border-bottom:1px solid #1d2f47\">Proxy for identity<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#0c1a2c;text-wrap:pretty\">Skull measurements, IQ tests, “blood” classification<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#151a2c;text-wrap:pretty\">ZIP code, cost history, name, vocabulary, purchase patterns<\u002Fdiv>\n\n    <div style=\"padding:19px 22px 19px 0;font-size:26px;color:#e9e6df;border-bottom:1px solid #1d2f47\">Institutional laundering<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#0c1a2c;text-wrap:pretty\">Hereditary health courts, immigration boards, universities<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;border-bottom:1px solid #1d2f47;background:#151a2c;text-wrap:pretty\">Vendor benchmarks, opaque proprietary scoring, compliance audits<\u002Fdiv>\n\n    <div style=\"padding:19px 22px 19px 0;font-size:26px;color:#d94f2b\">Feedback loop<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;background:#0c1a2c;text-wrap:pretty\">Policy targets groups → more “confirming” data is generated<\u002Fdiv>\n    <div style=\"padding:19px 26px;font-size:25px;line-height:1.45;color:#b6c4d3;background:#151a2c;text-wrap:pretty\">Model shapes outcomes → training data for the next model<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Bigger now\" data-screen-label=\"19\" data-speaker-notes=\"Scale, opacity, automation bias — and a structural concentration of who builds the models.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · A structural risk<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">Why the risk is bigger now, not smaller<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:72px;margin-top:44px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:30px\">\n      <div style=\"display:flex;gap:28px;border-bottom:1px solid #1d2f47;padding-bottom:26px\">\n        <div style=\"width:220px;flex:none;font-size:30px;color:#d94f2b\">Scale<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.5;color:#b6c4d3;text-wrap:pretty\">A 1930s hereditary health court processed cases one file at a time. A single model scores millions of people before lunch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:28px;border-bottom:1px solid #1d2f47;padding-bottom:26px\">\n        <div style=\"width:220px;flex:none;font-size:30px;color:#d94f2b\">Opacity<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.5;color:#b6c4d3;text-wrap:pretty\">Pearson’s chi-squared test was published and debatable. Proprietary scoring systems are often black boxes, unreviewable by those they score.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:28px;border-bottom:1px solid #1d2f47;padding-bottom:26px\">\n        <div style=\"width:220px;flex:none;font-size:30px;color:#d94f2b\">Automation bias<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.5;color:#b6c4d3;text-wrap:pretty\">People trust an algorithmic score more than an equivalent human judgment. “The model said so” becomes its own kind of scientific authority.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:28px\">\n        <div style=\"width:220px;flex:none;font-size:30px;color:#d94f2b\">Detachment<\u002Fdiv>\n        <div style=\"font-size:25px;line-height:1.5;color:#b6c4d3;text-wrap:pretty\">Downstream companies receive a sealed system they cannot open, retrain or fully debug — and inherit accountability for correlations they never chose.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border:1px solid #1d2f47;background:#0c1a2c;padding:34px 38px;display:flex;flex-direction:column;min-height:0\">\n      <div style=\"font-size:24px;letter-spacing:0.18em;text-transform:uppercase;color:#6b8299\">fig. 5 · concentration<\u002Fdiv>\n      <svg sc-camel-view-box=\"0 0 560 240\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;margin-top:20px\">\n        <line x1=\"50\" y1=\"200\" x2=\"540\" y2=\"200\" stroke=\"#1d2f47\" stroke-width=\"1\"><\u002Fline>\n        <line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"200\" stroke=\"#1d2f47\" stroke-width=\"1\"><\u002Fline>\n        <path d=\"M60 194 L140 186 L220 168 L300 132 L380 88 L460 44 L520 22\" fill=\"none\" stroke=\"#d94f2b\" stroke-width=\"3\"><\u002Fpath>\n        <path d=\"M60 194 L140 186 L220 168 L300 132 L380 88 L460 44 L520 22 L520 200 L60 200 Z\" fill=\"#d94f2b\" opacity=\"0.09\"><\u002Fpath>\n        <text x=\"50\" y=\"226\" fill=\"#6b8299\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">2016<\u002Ftext>\n        <text x=\"490\" y=\"226\" fill=\"#6b8299\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">2027 (proj.)<\u002Ftext>\n        <text x=\"300\" y=\"60\" fill=\"#e9e6df\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">2.4× / year<\u002Ftext>\n        <text x=\"300\" y=\"82\" fill=\"#93a5b8\" font-family=\"'JetBrains Mono',monospace\" font-size=\"20\">frontier training cost<\u002Ftext>\n      <\u002Fsvg>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:32px;border-top:1px solid #1d2f47;margin-top:22px;padding-top:24px\">\n        <div>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;color:#e9e6df;line-height:1\">~1.76T<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.4;color:#93a5b8;margin-top:10px;text-wrap:pretty\">estimated parameters reported for GPT-4 — beyond what an outside team could audit or retrain<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;color:#d94f2b;line-height:1\">58 → 40<\u002Fdiv>\n          <div style=\"font-size:24px;line-height:1.4;color:#93a5b8;margin-top:10px;text-wrap:pretty\">Stanford Foundation Model Transparency Index: the most capable models now disclose the least<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showSources }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"border-top:1px solid #1d2f47;margin-top:20px;padding-top:16px;font-size:24px;line-height:1.4;color:#566e88\">Cottier et al. (2024); SemiAnalysis (2023); Stanford HAI Foundation Model Transparency Index &amp; AI Index Report.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Caveat\" data-screen-label=\"20\" data-speaker-notes=\"This does not indict statistics. The failure mode is specific.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#a8412a\">A necessary caveat<\u002Fdiv>\n  <div style=\"font-family:'Space Grotesk',sans-serif;font-size:78px;font-weight:500;letter-spacing:-0.035em;margin:24px 0 0\">Correlation is a tool, not an ideology<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:56px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;gap:30px;font-size:28px;line-height:1.5;color:#4a5460\">\n      <div style=\"text-wrap:pretty\">None of this indicts statistics or machine learning. Correlation is indispensable to medicine, economics and science broadly.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">The failure mode is specific: skipping causal validation, ignoring the social history embedded in the data, and hiding behind a claim of neutrality.<\u002Fdiv>\n      <div style=\"text-wrap:pretty\">Galton and Pearson’s math was later reused in rigorous, unbiased causal research. The tool survived; what changed was accountability for how it was applied.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-left:3px solid #0b0d10;padding-left:44px;display:flex;flex-direction:column;justify-content:center;gap:24px\">\n      <div style=\"font-size:24px;letter-spacing:0.2em;text-transform:uppercase;color:#a8412a\">The question for AI<\u002Fdiv>\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:48px;line-height:1.2;letter-spacing:-0.02em;text-wrap:pretty\">Not “should we use correlation?” but: what validation, transparency and oversight stand between a correlation and a consequential decision about a person?<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Countermeasures\" data-screen-label=\"21\" data-speaker-notes=\"Six requirements. None of them are new.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · Countermeasures<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:22px 0 0\">What responsible AI requires<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:2px;margin-top:56px;flex:1;background:#1d2f47;border:1px solid #1d2f47\">\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">01<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Causal validation<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Test whether a feature drives the outcome, or merely rides along with a protected trait.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">02<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Representative data<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Audit training data for who is over- or under-represented, and why.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">03<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Transparency<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Make scoring logic reviewable — by regulators, auditors, and the people being scored.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">04<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Independent audits<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Measure disparate impact directly. Don’t rely on the absence of a “race” column.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">05<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Regulation with teeth<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Frameworks like the EU AI Act and disparate-impact law need enforcement, not just disclosure.<\u002Fdiv><\u002Fdiv>\n    <div style=\"background:#0c1a2c;padding:28px 30px;display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:24px;color:#6b8299\">06<\u002Fdiv><div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.15;color:#d94f2b\">Human oversight<\u002Fdiv><div style=\"font-size:25px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Keep an accountable human in the loop for lending, hiring, justice and healthcare.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Patent example\" data-screen-label=\"22\" data-speaker-notes=\"Countermeasure 03 was Transparency. Here is a working example of it.\" style=\"box-sizing:border-box;padding:66px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · Transparency, built<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:500;letter-spacing:-0.03em;margin:18px 0 0;text-wrap:pretty\">Visualizing why a model decided, not just what it decided<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1.1fr 1fr;gap:64px;margin-top:48px;flex:1\">\n    <div style=\"background:#0c1a2c;border:1px solid #1d2f47;padding:32px 34px;display:flex;flex-direction:column;gap:16px\">\n      <div style=\"font-size:22px;letter-spacing:0.12em;text-transform:uppercase;color:#6b8299\">U.S. Patent 11,599,579<\u002Fdiv>\n      <a href=\"https://patents.justia.com/patent/11599579\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.2;color:#e9e6df;text-decoration:none;border-bottom:1px solid rgba(233,230,223,0.25)\">Anomaly Visualization for Computerized Models<\u002Fa>\n      <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;text-wrap:pretty\">Carmel Nadav · assigned to Wells Fargo Bank, N.A.<br>Filed July 7, 2021 · Granted March 7, 2023<\u002Fdiv>\n      <div style=\"font-size:25px;line-height:1.55;color:#b6c4d3;text-wrap:pretty;border-top:1px solid #1d2f47;padding-top:16px;margin-top:4px\">Ranks the input features behind a single model decision by importance score, and surfaces them to a human reviewer — turning a correlation the model found into something a person can actually inspect.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:22px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.2;letter-spacing:-0.015em;color:#e9e6df;text-wrap:pretty\">This is countermeasure 03 from the previous page, in working form.<\u002Fdiv>\n      <div style=\"font-size:26px;line-height:1.55;color:#93a5b8;text-wrap:pretty\">The failure this deck traces was never correlation itself — it was correlation certified as truth with no way to open it up and check. An interface that shows which features drove an anomaly score, ranked and visible, is the opposite habit: it makes the model's reasoning reviewable by the people relying on it, instead of asking them to take the score on faith.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Globe · the spread\" data-screen-label=\"23\" data-speaker-notes=\"Step the decades. The statute travels: London, then the American states, then Berlin, then Scandinavia and Tokyo.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · Geography of the pattern<\u002Fdiv>\n    <div style=\"font-size:24px;letter-spacing:0.2em;color:#6b8299\">{{ decadeStatus }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:18px 0 0\">How the statute travelled<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:680px 1fr;gap:72px;margin-top:26px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <svg sc-camel-view-box=\"0 0 600 600\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;flex:1;min-height:0\">\n        <g ref=\"{{ histRef }}\"><\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <div style=\"display:flex;gap:2px;background:#1d2f47;border:1px solid #1d2f47\">\n        <sc-for list=\"{{ decades }}\" as=\"d\" hint-placeholder-count=\"5\">\n          <div sc-camel-on-click=\"{{ d.select }}\" style=\"cursor:pointer;flex:1;background:{{ d.bg }};padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;min-height:48px\" style-hover=\"background:#16283f\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;line-height:1;color:{{ d.color }}\">{{ d.label }}<\u002Fdiv>\n            <div style=\"font-size:24px;color:#6b8299;text-align:center;line-height:1.25\">{{ d.sub }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:24px;margin-top:30px\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:104px;line-height:0.9;color:#d94f2b;letter-spacing:-0.03em\">{{ histCount }}<\u002Fdiv>\n        <div style=\"font-size:24px;line-height:1.4;color:#b6c4d3;text-wrap:pretty\">eugenic statutes, rulings and institutions plotted by {{ histCutLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;margin-top:26px;flex:1;min-height:0;border-top:1px solid #1d2f47\">\n        <sc-for list=\"{{ histEvents }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:26px;align-items:baseline;padding:18px 0;border-bottom:1px solid #1d2f47\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:34px;color:#e9e6df;flex:none;width:110px\">{{ e.y }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"font-size:24px;color:#e9e6df\">{{ e.place }}<\u002Fdiv>\n              <div style=\"font-size:24px;line-height:1.4;color:#93a5b8;text-wrap:pretty\">{{ e.label }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:24px;line-height:1.4;color:#6b8299;padding-top:18px;text-wrap:pretty\">The method was portable. Every jurisdiction cited the same statistical literature.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Globe · line of descent\" data-screen-label=\"24\" data-speaker-notes=\"Same sphere, two eras. The arc is the argument: the method did not stop, it relocated.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">Act IV · One line of descent<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:70px;font-weight:500;letter-spacing:-0.03em;margin:18px 0 0\">London 1869 → Berlin 1933 → Palo Alto today<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:680px 1fr;gap:72px;margin-top:26px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <svg sc-camel-view-box=\"0 0 600 600\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" style=\"width:100%;flex:1;min-height:0\">\n        <g ref=\"{{ bothRef }}\"><\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;min-height:0\">\n      <div style=\"display:flex;gap:44px;border-bottom:1px solid #1d2f47;padding-bottom:22px\">\n        <div style=\"display:flex;align-items:center;gap:16px\"><div style=\"width:18px;height:18px;border-radius:50%;background:#d94f2b;flex:none\"><\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Eugenic statutes, 1928–45<\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:16px\"><div style=\"width:18px;height:18px;border-radius:50%;border:2.5px solid #7d9ab0;flex:none\"><\u002Fdiv><div style=\"font-size:24px;color:#b6c4d3\">Frontier AI hubs, today<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;margin-top:24px\">\n        <div style=\"display:flex;gap:26px;align-items:baseline;padding:20px 0;border-bottom:1px solid #1d2f47\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;flex:none;width:64px\">01<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:26px;color:#e9e6df\">London, 1869–1911<\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Galton and Pearson build regression, correlation and the significance test inside the eugenics movement.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:26px;align-items:baseline;padding:20px 0;border-bottom:1px solid #1d2f47\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#d94f2b;flex:none;width:64px\">02<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:26px;color:#e9e6df\">Berlin, 1933–1945<\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">The same research tradition staffs hereditary health courts, and the statistics become statute, sterilization and genocide.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:26px;align-items:baseline;padding:20px 0;border-bottom:1px solid #1d2f47\">\n          <div style=\"font-family:'Space Grotesk',sans-serif;font-size:30px;color:#7d9ab0;flex:none;width:64px\">03<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-size:26px;color:#e9e6df\">Palo Alto, today<\u002Fdiv>\n            <div style=\"font-size:24px;line-height:1.45;color:#93a5b8;text-wrap:pretty\">Correlation-finding at planetary scale, inside sealed models, scoring millions of people a day.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-anim=\"up3\" style=\"margin-top:auto;border-left:3px solid #d94f2b;padding-left:34px;font-family:'Space Grotesk',sans-serif;font-size:38px;line-height:1.24;color:#e9e6df;text-wrap:pretty\">The arc is not an accusation of intent. It is a line of method — and it has never been broken.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Predictions (interactive)\" data-screen-label=\"25\" data-speaker-notes=\"Click any row to open the reasoning. Each is an extrapolation of a documented trend.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">If the pattern holds<\u002Fdiv>\n    <div style=\"font-size:24px;letter-spacing:0.16em;color:#6b8299\">click a row to expand<\u002Fdiv>\n  <\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:66px;font-weight:500;letter-spacing:-0.03em;margin:20px 0 0\">Uncomfortable predictions — extrapolated, not invented<\u002Fdiv>\n  <div style=\"font-size:25px;line-height:1.5;color:#93a5b8;margin-top:18px;max-width:1400px;text-wrap:pretty\">These may sound alarmist. Each is a direct extrapolation of trends already documented above, not speculation about hypothetical technology.<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;margin-top:30px;flex:1;min-height:0;border-top:1px solid #1d2f47\">\n    <sc-for list=\"{{ predictions }}\" as=\"p\" hint-placeholder-count=\"5\">\n      <div sc-camel-on-click=\"{{ p.toggle }}\" style=\"cursor:pointer;border-bottom:1px solid #1d2f47;padding:18px 8px;display:flex;gap:26px;align-items:flex-start;background:{{ p.bg }};min-height:48px\" style-hover=\"background:#122238\">\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-size:32px;color:{{ p.numColor }};flex:none;width:56px\">{{ p.num }}<\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font-size:31px;line-height:1.25;color:#e9e6df;text-wrap:pretty\">{{ p.title }}<\u002Fdiv>\n          <sc-if value=\"{{ p.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:24px;line-height:1.5;color:#93a5b8;max-width:1300px;text-wrap:pretty\">{{ p.body }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:32px;color:#d94f2b;flex:none;width:36px;text-align:right\">{{ p.sign }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Closing\" data-screen-label=\"26\" data-speaker-notes=\"The tools that once measured skulls now measure clickstreams.\" style=\"box-sizing:border-box;padding:82px 92px;background:radial-gradient(120% 90% at 88% -12%, #f7f4ed 0%, rgba(233,230,223,0) 62%), radial-gradient(85% 65% at -5% 112%, #dcd5c6 0%, rgba(233,230,223,0) 58%), #e9e6df;color:#0b0d10;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;justify-content:center;gap:52px;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(11,13,16,0.055) 1px,transparent 1px),linear-gradient(90deg,rgba(11,13,16,0.055) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(168,65,42,0.10) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#a8412a\">Closing thought<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:82px;font-weight:500;line-height:1.1;letter-spacing:-0.035em;max-width:1560px;text-wrap:pretty\">Eugenics and Nazi racial hygiene did not need to invent new hatred. They needed a statistical method willing to certify old hatred as fact.<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:80px;border-top:2px solid #0b0d10;padding-top:40px\">\n    <div style=\"font-size:29px;line-height:1.5;color:#4a5460;text-wrap:pretty\">AI does not need to be built with malicious intent to repeat that pattern. It only needs to be built without asking what its correlations are standing in for — and without anyone accountable for finding out.<\u002Fdiv>\n    <div style=\"font-family:'Space Grotesk',sans-serif;font-size:42px;line-height:1.25;letter-spacing:-0.02em;text-wrap:pretty\">The tools that once measured skulls now measure clickstreams. The discipline required has not changed.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"References\" data-screen-label=\"27\" data-speaker-notes=\"Sources and further reading.\" style=\"box-sizing:border-box;padding:60px 92px;background:radial-gradient(130% 100% at 8% -18%, #1b3a5e 0%, rgba(8,17,31,0) 62%), radial-gradient(95% 75% at 102% 112%, #2a1a1c 0%, rgba(8,17,31,0) 58%), #08111f;color:#e9e6df;font-family:'JetBrains Mono',ui-monospace,monospace;display:flex;flex-direction:column;overflow:hidden\">\n  <div data-bg-grid=\"\" style=\"position:absolute;top:-80px;left:-80px;right:-80px;bottom:-80px;pointer-events:none;background-image:linear-gradient(rgba(233,230,223,0.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,230,223,0.045) 1px,transparent 1px);background-size:72px 72px\"><\u002Fdiv>\n  <div data-bg-glow=\"\" style=\"position:absolute;width:820px;height:820px;right:-240px;bottom:-320px;pointer-events:none;border-radius:50%;background:radial-gradient(circle,rgba(217,79,43,0.13) 0%,transparent 68%)\"><\u002Fdiv>\n  <div data-anim=\"up\" style=\"font-size:24px;letter-spacing:0.3em;text-transform:uppercase;color:#d94f2b\">References<\u002Fdiv>\n  <div data-anim=\"up2\" style=\"font-family:'Space Grotesk',sans-serif;font-size:60px;font-weight:500;letter-spacing:-0.03em;margin:18px 0 0\">Sources &amp; further reading<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 72px;margin-top:26px;flex:1;font-size:24px;line-height:1.5;color:#93a5b8\">\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div>Nadav, C. “Correlation: A Biography of Dangerous Ideas, Implications for Big-Data Practitioners.” FARCON, Carlson School of Management, University of Minnesota (2016).<\u002Fdiv>\n      <div>Nadav, C. U.S. Patent No. 11,599,579, “Anomaly Visualization for Computerized Models,” assigned to Wells Fargo Bank, N.A. (filed 2021; granted 2023).<\u002Fdiv>\n      <div>Galton, F. <em style=\"font-style:normal;color:#b6c4d3\">Hereditary Genius<\u002Fem> (1869); Nautilus, “How Eugenics Shaped Statistics” (2019).<\u002Fdiv>\n      <div>Los Angeles Review of Books, “The ‘Correlation’ Between Statistics and Eugenics.”<\u002Fdiv>\n      <div>U.S. Holocaust Memorial Museum, “The Biological State: Nazi Racial Hygiene, 1933–1939” and “Final Solutions: Murderous Racial Hygiene, 1939–1945.”<\u002Fdiv>\n      <div>Angwin, J. et al. “Machine Bias.” ProPublica (2016).<\u002Fdiv>\n      <div>Obermeyer, Z., Powers, B., Vogeli, C., Mullainathan, S. “Dissecting racial bias in an algorithm used to manage the health of populations.” <em style=\"font-style:normal;color:#b6c4d3\">Science<\u002Fem> (2019).<\u002Fdiv>\n      <div>Buolamwini, J. &amp; Gebru, T. “Gender Shades.” PMLR (2018).<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:18px\">\n      <div>ACLU, “Why Amazon’s Automated Hiring Tool Discriminated Against Women” (2018).<\u002Fdiv>\n      <div>Consumer Federation of America, “From Redlined Maps to Algorithms… How Insurance Exclusion Happens Today.”<\u002Fdiv>\n      <div>Sjoding, M. et al. “Racial Bias in Pulse Oximetry Measurement.” <em style=\"font-style:normal;color:#b6c4d3\">NEJM<\u002Fem> (2020); Fawzy, A. et al. <em style=\"font-style:normal;color:#b6c4d3\">JAMA Internal Medicine<\u002Fem> (2022).<\u002Fdiv>\n      <div>Wynants, L. et al. “Prediction models for diagnosis and prognosis of covid-19.” <em style=\"font-style:normal;color:#b6c4d3\">BMJ<\u002Fem> (2020, living review).<\u002Fdiv>\n      <div>The Guardian, reprinted by the Center for Genetics and Society, “‘Eugenics on Steroids’: The Toxic and Contested Legacy of Oxford’s Future of Humanity Institute” (2024).<\u002Fdiv>\n      <div>Torres, É. “Nick Bostrom, Longtermism, and the Eternal Return of Eugenics.” Truthdig.<\u002Fdiv>\n      <div>Cottier, B. et al. “The Rising Costs of Training Frontier AI Models” (2024); SemiAnalysis on GPT-4’s architecture (2023).<\u002Fdiv>\n      <div>Stanford HAI, Foundation Model Transparency Index (2025) and AI Index Report (2026).<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:1px solid #1d2f47;padding-top:24px;display:flex;justify-content:space-between;font-size:24px;color:#6b8299\">\n    <div>Carmel Nadav<\u002Fdiv>\n    <div>© 2026 Carmel Nadav · All Rights Reserved<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showSources&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Deck&quot;},&quot;predictionsOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Deck&quot;}}\">\nclass Component extends DCLogic {\n  state = { confound: false, proxyOn: false, caseIdx: 0, openPred: 0, decade: 0 };\n\n  componentDidMount() {\n    if (this.props.predictionsOpen) this.setState({ openPred: -2 });\n    this._rot = -25; this._arcT = 0; this._arcHold = 0;\n    this._tick = this._tick.bind(this);\n    this._raf = requestAnimationFrame(this._tick);\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._autoTimer) clearInterval(this._autoTimer);\n  }\n\n  _tick() {\n    this._rot = (this._rot + 0.11) % 360;\n    if (this._arcHold > 0) { this._arcHold -= 1; }\n    else if (this._arcT < 1) { this._arcT = Math.min(1, this._arcT + 0.007); if (this._arcT === 1) this._arcHold = 150; }\n    else { this._arcT = 0; }\n    this._drawGlobe(this._gA, 'A');\n    this._drawGlobe(this._gB, 'B');\n    this._raf = requestAnimationFrame(this._tick);\n  }\n\n  _proj(lon, lat, rot) {\n    const D = Math.PI / 180, R = 282, T = 20 * D;\n    const l = (lon + rot) * D, p = lat * D;\n    const cp = Math.cos(p), sp = Math.sin(p), cl = Math.cos(l), sl = Math.sin(l);\n    const ct = Math.cos(T), st = Math.sin(T);\n    return { x: 300 + R * cp * sl, y: 300 - R * (sp * ct - cp * cl * st), z: cp * cl * ct + sp * st };\n  }\n\n  _poly(pts, rot) {\n    let d = '', pen = false;\n    for (let i = 0; i < pts.length; i++) {\n      const q = this._proj(pts[i][0], pts[i][1], rot);\n      if (q.z > 0.02) { d += (pen ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1) + ' '; pen = true; }\n      else pen = false;\n    }\n    return d;\n  }\n\n  _graticule() {\n    if (this._grat) return this._grat;\n    const g = [];\n    for (let lo = -180; lo < 180; lo += 30) { const a = []; for (let la = -85; la <= 85; la += 5) a.push([lo, la]); g.push(a); }\n    for (let la = -60; la <= 60; la += 30) { const a = []; for (let lo = -180; lo <= 180; lo += 5) a.push([lo, la]); g.push(a); }\n    this._grat = g; return g;\n  }\n\n  _arcPts(a, b, n) {\n    const D = Math.PI / 180;\n    const toV = (p) => { const lo = p[0] * D, la = p[1] * D; return [Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)]; };\n    const va = toV(a), vb = toV(b);\n    const dot = Math.max(-1, Math.min(1, va[0] * vb[0] + va[1] * vb[1] + va[2] * vb[2]));\n    const om = Math.acos(dot), so = Math.sin(om) || 1e-6, out = [];\n    for (let i = 0; i <= n; i++) {\n      const t = i / n, s1 = Math.sin((1 - t) * om) / so, s2 = Math.sin(t * om) / so;\n      const v = [va[0] * s1 + vb[0] * s2, va[1] * s1 + vb[1] * s2, va[2] * s1 + vb[2] * s2];\n      out.push([Math.atan2(v[1], v[0]) / D, Math.asin(Math.max(-1, Math.min(1, v[2]))) / D]);\n    }\n    return out;\n  }\n\n  _hist() {\n    return [\n      { lon: -0.13, lat: 51.51, y: 1869, place: 'London, United Kingdom', label: 'Galton\\u2019s Hereditary Genius ranks races on a bell curve', big: true },\n      { lon: -0.13, lat: 51.51, y: 1883, place: 'London, United Kingdom', label: 'Galton coins the word \\u201ceugenics\\u201d' },\n      { lon: -0.13, lat: 51.51, y: 1901, place: 'London, United Kingdom', label: 'Pearson founds Biometrika; the UCL eugenics laboratory follows' },\n      { lon: -86.16, lat: 39.77, y: 1907, place: 'Indiana, United States', label: 'First compulsory sterilization law in the world' },\n      { lon: -77.04, lat: 38.91, y: 1924, place: 'Washington, United States', label: 'Immigration Act caps entry by national origin' },\n      { lon: -77.04, lat: 38.91, y: 1927, place: 'Washington, United States', label: 'Buck v. Bell upholds compulsory sterilization', big: true },\n      { lon: -113.49, lat: 53.55, y: 1928, place: 'Alberta, Canada', label: 'Sexual Sterilization Act' },\n      { lon: 12.57, lat: 55.68, y: 1929, place: 'Copenhagen, Denmark', label: 'First European sterilization law' },\n      { lon: 13.40, lat: 52.52, y: 1933, place: 'Berlin, Germany', label: 'Law for the Prevention of Offspring with Hereditary Diseases', big: true },\n      { lon: -123.37, lat: 48.43, y: 1933, place: 'British Columbia, Canada', label: 'Sexual Sterilization Act' },\n      { lon: 18.07, lat: 59.33, y: 1934, place: 'Stockholm, Sweden', label: 'Sterilization law enacted' },\n      { lon: 10.75, lat: 59.91, y: 1934, place: 'Oslo, Norway', label: 'Sterilization law enacted' },\n      { lon: 13.40, lat: 52.52, y: 1935, place: 'Berlin, Germany', label: 'Nuremberg Laws codify racial classification' },\n      { lon: 13.40, lat: 52.52, y: 1939, place: 'Berlin, Germany', label: 'T4 euthanasia programme begins' },\n      { lon: 139.69, lat: 35.68, y: 1940, place: 'Tokyo, Japan', label: 'National Eugenic Law' },\n      { lon: 13.40, lat: 52.52, y: 1941, place: 'Berlin, Germany', label: 'Racial hygiene escalates into the Holocaust', big: true }\n    ];\n  }\n\n  _hubs() {\n    return [\n      { lon: -122.14, lat: 37.44 }, { lon: -122.33, lat: 47.61 }, { lon: -0.13, lat: 51.51 },\n      { lon: 2.35, lat: 48.86 }, { lon: 116.40, lat: 39.90 }, { lon: 120.16, lat: 30.27 }\n    ];\n  }\n\n  _decades() {\n    return [\n      { label: '1869', cut: 1883, sub: 'Hereditary Genius' },\n      { label: '1900s', cut: 1910, sub: 'first statutes' },\n      { label: '1920s', cut: 1929, sub: 'Buck v. Bell' },\n      { label: '1930s', cut: 1936, sub: 'racial hygiene' },\n      { label: '1940s', cut: 1945, sub: 'genocide' }\n    ];\n  }\n\n  _drawGlobe(g, kind) {\n    if (!g) return;\n    const sec = g.closest && g.closest('section');\n    if (!sec || !sec.hasAttribute('data-deck-active')) return;\n    const NS = 'http://www.w3.org/2000/svg';\n    let st = g.__st;\n    if (!st) {\n      const mk = (t, attrs) => { const e = document.createElementNS(NS, t); for (const k in attrs) e.setAttribute(k, String(attrs[k])); g.appendChild(e); return e; };\n      st = g.__st = {};\n      mk('circle', { cx: 300, cy: 300, r: 282, fill: 'rgba(125,170,205,0.06)', stroke: '#3d5b7d', 'stroke-width': 1.4 });\n      st.grat = mk('path', { fill: 'none', stroke: '#2f4864', 'stroke-width': 1 });\n      st.list = kind === 'A' ? this._hist() : this._hist().filter((h) => h.y >= 1928 || h.big);\n      if (kind === 'B') st.arc = mk('path', { fill: 'none', stroke: '#e9e6df', 'stroke-width': 2.5, 'stroke-linecap': 'round', opacity: 0.85 });\n      st.halos = st.list.map(() => mk('circle', { fill: '#d94f2b', opacity: 0 }));\n      st.nodes = st.list.map(() => mk('circle', { fill: '#d94f2b' }));\n      if (kind === 'B') st.hubs = this._hubs().map(() => mk('circle', { fill: 'none', stroke: '#7d9ab0', 'stroke-width': 2.5 }));\n    }\n    const rot = this._rot;\n    let d = '';\n    const grat = this._graticule();\n    for (let i = 0; i < grat.length; i++) d += this._poly(grat[i], rot);\n    st.grat.setAttribute('d', d);\n    const cut = kind === 'A' ? this._decades()[this.state.decade].cut : 9999;\n    const pulse = 1 + 0.35 * Math.sin(Date.now() / 620);\n    for (let i = 0; i < st.list.length; i++) {\n      const h = st.list[i], q = this._proj(h.lon, h.lat, rot);\n      const vis = q.z > 0 && h.y <= cut;\n      const r = h.big ? 9 : 6;\n      const n = st.nodes[i], halo = st.halos[i];\n      n.setAttribute('cx', q.x.toFixed(1)); n.setAttribute('cy', q.y.toFixed(1)); n.setAttribute('r', String(r));\n      n.setAttribute('opacity', vis ? String(0.55 + 0.45 * q.z) : '0');\n      halo.setAttribute('cx', q.x.toFixed(1)); halo.setAttribute('cy', q.y.toFixed(1));\n      halo.setAttribute('r', String(r * (1.7 + pulse * 0.5)));\n      halo.setAttribute('opacity', vis && h.big ? String(0.16 * q.z) : '0');\n    }\n    if (st.hubs) {\n      const hubs = this._hubs();\n      for (let i = 0; i < hubs.length; i++) {\n        const q = this._proj(hubs[i].lon, hubs[i].lat, rot), c = st.hubs[i];\n        c.setAttribute('cx', q.x.toFixed(1)); c.setAttribute('cy', q.y.toFixed(1));\n        c.setAttribute('r', String(8 + pulse));\n        c.setAttribute('opacity', q.z > 0 ? String(0.5 + 0.5 * q.z) : '0');\n      }\n    }\n    if (st.arc) {\n      if (!this._arcPath) {\n        this._arcPath = this._arcPts([-0.13, 51.51], [13.40, 52.52], 24).concat(this._arcPts([13.40, 52.52], [-122.14, 37.44], 72));\n      }\n      const n = Math.max(2, Math.floor(this._arcPath.length * this._arcT));\n      st.arc.setAttribute('d', this._poly(this._arcPath.slice(0, n), rot));\n    }\n    if (kind === 'A' && !this._autoStarted) {\n      this._autoStarted = true;\n      this._autoTimer = setInterval(() => {\n        if (this._userStepped) { clearInterval(this._autoTimer); return; }\n        this.setState((s) => {\n          if (s.decade >= 4) { clearInterval(this._autoTimer); return null; }\n          return { decade: s.decade + 1 };\n        });\n      }, 1700);\n    }\n  }\n\n  _points() {\n    // deterministic pseudo-random scatter, two latent groups\n    const pts = [];\n    let s = 20250903;\n    const rnd = () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };\n    for (let i = 0; i < 46; i++) {\n      const g = i % 2;\n      const base = g === 0 ? 0.18 : 0.58;\n      const t = base + rnd() * 0.34;\n      const noise = (rnd() - 0.5) * 0.16;\n      const x = 72 + t * 456;\n      const y = 300 - (t + noise) * 230;\n      pts.push({ x: Math.round(x), y: Math.round(Math.max(46, Math.min(322, y))), g });\n    }\n    return pts;\n  }\n\n  render_cases() {\n    return [\n      {\n        tab: 'COMPAS recidivism scores', domain: 'Criminal justice',\n        title: 'COMPAS: recidivism risk scores',\n        desc: 'Widely used to advise bail, sentencing and parole. Race is not an input — but correlated variables (employment, education, neighborhood) reconstruct much of its predictive signal.',\n        heroN: '77%', heroL: 'more likely that Black defendants were flagged higher-risk for future violent crime',\n        bars: [\n          { label: 'Falsely flagged high-risk — Black defendants', val: '44.9%', pct: 44.9, accent: true },\n          { label: 'Falsely flagged high-risk — white defendants', val: '23.5%', pct: 23.5 },\n          { label: 'Overall accuracy — barely better than a coin flip', val: '61%', pct: 61 }\n        ],\n        notes: [],\n        source: 'Angwin et al., “Machine Bias,” ProPublica (2016) — analysis of ~7,000 Broward County, FL risk scores.'\n      },\n      {\n        tab: 'Population-health algorithm', domain: 'Healthcare',\n        title: 'A population-health algorithm, millions of patients',\n        desc: 'Used across U.S. health systems to flag patients for extra care. It used healthcare cost as a proxy for health need — but Black patients historically incur lower costs for the same underlying illness, due to unequal access to care.',\n        heroN: '+26%', heroL: 'more chronic illness Black patients carried, on average, at the same predicted risk score',\n        bars: [\n          { label: 'Share of enrolled patients who were Black — cost proxy', val: '17.7%', pct: 17.7 },\n          { label: 'Share of enrolled patients who were Black — direct health measure', val: '46.5%', pct: 46.5, accent: true },\n          { label: 'Bias reduction once cost was replaced', val: '86%', pct: 86 }\n        ],\n        notes: [],\n        source: 'Obermeyer, Powers, Vogeli & Mullainathan, “Dissecting racial bias in an algorithm…,” Science (2019).'\n      },\n      {\n        tab: 'Gender Shades', domain: 'Biometrics',\n        title: 'Gender Shades: facial analysis systems',\n        desc: 'Three commercial gender-classification systems were tested across skin tone and gender. Training data skewed heavily toward light-skinned men, correlating benchmark “image quality” with one narrow demographic.',\n        heroN: '46.8%', heroL: 'error rate for the darkest-skinned women — worse than a coin flip',\n        bars: [\n          { label: 'Error rate — light-skinned men (all three systems)', val: '0.8%', pct: 0.8 },\n          { label: 'Error rate — darker-skinned women (worst system)', val: '34.7%', pct: 34.7 },\n          { label: 'Error rate — darkest-skinned women', val: '46.8%', pct: 46.8, accent: true }\n        ],\n        notes: [],\n        source: 'Buolamwini & Gebru, “Gender Shades,” Proceedings of Machine Learning Research (2018).'\n      },\n      {\n        tab: 'Hiring, credit & insurance', domain: 'Employment / lending',\n        title: 'Learning yesterday’s workforce and neighborhoods',\n        desc: 'Amazon’s internal resume screener, trained on a decade of predominantly male engineering hires, penalized resumes containing “women’s” and favored male-coded verbs. Credit and insurance models trained on historically redlined data reproduce the same geographic discrimination under the label algorithmic redlining.',\n        heroN: '“Women’s”', heroL: 'flagged as a negative signal on resumes — as in “women’s chess club”',\n        bars: [],\n        notes: [\n          { n: 'A decade', l: 'of male-dominated engineering hires supplied the training labels' },\n          { n: 'Scrapped', l: 'Amazon withdrew the system once the bias could not be reliably corrected' },\n          { n: 'ZIP → race', l: 'the credit and insurance proxy pattern documented across multiple studies' }\n        ],\n        source: 'ACLU (2018) on Amazon’s hiring tool; Consumer Federation of America on algorithmic redlining in insurance.'\n      },\n      {\n        tab: 'Pulse oximeters', domain: 'Public health, pt. I',\n        title: 'COVID-19: a “neutral” device with a racial correlation',\n        desc: 'Pulse oximeters — used worldwide to decide who needed supplemental oxygen and who qualified for COVID-19 treatment — were calibrated overwhelmingly on light skin. Melanin absorbs light differently, and that correlation was never validated across skin tones before mass deployment.',\n        heroN: '~3×', heroL: 'more often that dangerously low oxygen went undetected in Black patients',\n        bars: [\n          { label: 'Undetected low oxygen — Black patients', val: '11.7%', pct: 11.7, accent: true },\n          { label: 'Undetected low oxygen — white patients', val: '3.6%', pct: 3.6 }\n        ],\n        notes: [\n          { n: 'Delayed care', l: 'inflated readings meant Black and Hispanic patients were less often flagged as eligible for COVID-19 treatment' }\n        ],\n        source: 'Sjoding et al., New England Journal of Medicine (2020); Fawzy et al., JAMA Internal Medicine (2022).'\n      },\n      {\n        tab: 'Rushed COVID-19 models', domain: 'Public health, pt. II',\n        title: 'COVID-19: correlation at pandemic speed',\n        desc: 'Under emergency pressure, hundreds of AI models were rushed into clinical use to predict severity and help ration ventilators, ICU beds and vaccines — repeating, at speed, the same correlation-without-causation shortcut this deck has traced since Galton and Pearson.',\n        heroN: '200+', heroL: 'COVID-19 prediction models reviewed by an independent, ongoing academic audit',\n        bars: [\n          { label: 'Models judged low-risk-of-bias and fit for clinical deployment', val: 'Near-zero', pct: 1.5, accent: true }\n        ],\n        notes: [\n          { n: '7 of 1,300', l: 'first vaccine doses that reached frontline medical residents under one hospital’s initial algorithmic allocation formula, before public backlash forced a redesign' }\n        ],\n        source: 'Wynants et al., BMJ living systematic review (2020– ); reporting on Stanford Health Care’s Dec. 2020 vaccine allocation algorithm.'\n      }\n    ];\n  }\n\n  render_predictions() {\n    return [\n      { title: '“Colorblind” systems will discriminate more precisely than explicit racism ever could', body: 'Underwriting and pricing models will use thousands of correlated behavioral signals to reconstruct race and class with high fidelity — while remaining fully compliant with laws that only forbid using the trait directly.' },\n      { title: 'Risk scoring will shift from individuals to family and neighborhood networks', body: 'Predictive policing and lending models will increasingly score people by association — a digital echo of hereditary suspicion, justified as “network risk,” not ancestry.' },\n      { title: 'Genetic and biometric underwriting will revive actuarial eugenics', body: 'Health-risk and life-insurance models incorporating genomic or wearable data will sort populations by predicted cost and longevity — a hierarchy of “biological worth” reasserting itself through pricing, not policy.' },\n      { title: 'Generative AI will re-launder debunked racial pseudoscience as “neutral” output', body: 'Language models trained on historical text will resurface Galton- and Pearson-era claims with the appearance of statistical objectivity, unless deliberately audited and corrected.' },\n      { title: '“Fairness audits” will be gamed the way hereditary health courts gamed due process', body: 'Expect compliance-driven fairness metrics to be optimized for the audit itself, while the underlying proxy discrimination persists in production — accountability theater standing in for accountability.' }\n    ];\n  }\n\n  renderVals() {\n    const on = this.state.confound;\n    const points = this._points().map((p) => ({\n      x: p.x, y: p.y,\n      fill: on ? (p.g === 0 ? '#6f8091' : '#d94f2b') : '#c9c4b8'\n    }));\n\n    const px = this.state.proxyOn;\n    const proxies = [\n      { name: 'ZIP code / address', stands: 'stands in for race via historical redlining', pct: 84 },\n      { name: 'Healthcare cost history', stands: 'stands in for need, distorted by unequal access', pct: 76 },\n      { name: 'College name / vocabulary', stands: 'stands in for gender and class background', pct: 68 },\n      { name: 'Purchase & payment history', stands: 'stands in for income and neighborhood', pct: 61 }\n    ].map((p) => ({\n      name: p.name, stands: p.stands,\n      w: px ? p.pct + '%' : '0%',\n      v: px ? 'r = 0.' + p.pct : '—',\n      color: px ? '#d94f2b' : '#122238'\n    }));\n\n    const cases = this.render_cases();\n    const ci = Math.min(this.state.caseIdx, cases.length - 1);\n    const ac = cases[ci];\n    const activeCase = {\n      title: ac.title, desc: ac.desc, heroN: ac.heroN, heroL: ac.heroL, source: ac.source,\n      heroSize: (ac.heroN.length > 6 ? 44 : 86) + 'px',\n      notes: ac.notes,\n      bars: ac.bars.map((b) => ({\n        label: b.label, val: b.val,\n        w: Math.max(1.5, b.pct) + '%',\n        color: b.accent ? '#d94f2b' : '#6f8091'\n      }))\n    };\n\n    const preds = this.render_predictions();\n    const allOpen = this.state.openPred === -2;\n    const predictions = preds.map((p, i) => ({\n      num: String(i + 1).padStart(2, '0'),\n      title: p.title, body: p.body,\n      open: allOpen || this.state.openPred === i,\n      sign: (allOpen || this.state.openPred === i) ? '−' : '+',\n      bg: (allOpen || this.state.openPred === i) ? '#0f1e33' : 'transparent',\n      numColor: (allOpen || this.state.openPred === i) ? '#d94f2b' : '#6b8299',\n      toggle: () => this.setState((s) => ({ openPred: (s.openPred === i || s.openPred === -2) ? -1 : i }))\n    }));\n\n    const decs = this._decades();\n    const di = Math.min(this.state.decade, decs.length - 1);\n    const cut = decs[di].cut;\n    const prevCut = di === 0 ? 0 : decs[di - 1].cut;\n    const hist = this._hist();\n\n    return {\n      histRef: this._histRefFn || (this._histRefFn = (el) => { this._gA = el; }),\n      bothRef: this._bothRefFn || (this._bothRefFn = (el) => { this._gB = el; }),\n      decades: decs.map((d, i) => ({\n        label: d.label, sub: d.sub,\n        bg: i === di ? '#16283f' : '#0c1a2c',\n        color: i === di ? '#d94f2b' : '#93a5b8',\n        select: () => { this._userStepped = true; if (this._autoTimer) clearInterval(this._autoTimer); this.setState({ decade: i }); }\n      })),\n      histEvents: hist.filter((h) => h.y > prevCut && h.y <= cut).map((h) => ({ y: h.y, place: h.place, label: h.label })),\n      histCount: hist.filter((h) => h.y <= cut).length,\n      histCutLabel: decs[di].label,\n      decadeStatus: 'decade ' + String(di + 1) + ' / ' + String(decs.length) + '  \\u00b7  auto-rotating',\n\n      points,\n      toggleConfound: () => this.setState((s) => ({ confound: !s.confound })),\n      confoundLabel: on ? 'Hide the hidden third factor' : 'Reveal the hidden third factor',\n      confoundNote: on\n        ? 'The same points, coloured by a latent group the model never recorded. The trend line was never a fact about the trait — it was a fact about who ended up in which group, and why.'\n        : 'A strong, reproducible association. Nothing here tells you what produced it — and nothing here stops you from calling it a discovery about people.',\n\n      proxies,\n      proxyOn: px,\n      toggleProxy: () => this.setState((s) => ({ proxyOn: !s.proxyOn })),\n      proxyLabel: px ? 'Restore the race column' : 'Drop the race column',\n      proxyStatus: px ? 'race removed · proxies active' : 'race included',\n      raceDecoration: px ? 'line-through' : 'none',\n      raceWidth: px ? '0%' : '92%',\n      raceValue: px ? 'dropped' : 'r = 1.00',\n      proxyNote: px\n        ? 'Removing the column removed the label, not the signal. Dozens of everyday variables correlate with race closely enough for a model to reconstruct it — and the output now carries no trace of having done so.'\n        : 'With race as an explicit input, the discrimination is at least legible. Compliance usually responds by deleting the column.',\n\n      cases: cases.map((c, i) => ({\n        num: String(i + 1).padStart(2, '0'),\n        tab: c.tab, domain: c.domain,\n        bg: i === ci ? '#122238' : 'transparent',\n        numColor: i === ci ? '#d94f2b' : '#6b8299',\n        titleColor: i === ci ? '#e9e6df' : '#93a5b8',\n        select: () => this.setState({ caseIdx: i })\n      })),\n      activeCase,\n      caseCounter: 'case ' + String(ci + 1).padStart(2, '0') + ' / ' + String(cases.length).padStart(2, '0'),\n\n      predictions,\n      showSources: this.props.showSources !== false\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
